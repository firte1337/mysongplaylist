<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Music App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg-color: #ffffff;
            --secondary-bg: #f5f5f5;
            --text-color: #000000;
            --hint-color: #999999;
            --border-color: #cccccc;
            --button-color: #3390ec;
            --button-text: #ffffff;
        }
        
        body.dark-theme {
            --bg-color: #1a1a1a;
            --secondary-bg: #2d2d2d;
            --text-color: #ffffff;
            --hint-color: #888888;
            --border-color: #444444;
            --button-color: #3390ec;
            --button-text: #ffffff;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 140px;
            overflow-x: hidden;
            transition: background-color 0.3s, color 0.3s;
        }
        
        .header {
            padding: 15px 20px;
            background: var(--secondary-bg);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .back-btn {
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
            display: none;
        }
        
        .back-btn.visible {
            display: block;
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }
        
        .settings-icon {
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: background 0.2s;
            display: none;
        }
        
        .settings-icon:active {
            background: var(--border-color);
        }
        
        .settings-icon.visible {
            display: block;
        }
        
        .container {
            padding: 15px;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .tab {
            display: none;
        }
        
        .tab.active {
            display: block;
        }
        
        .track-item {
            background: var(--secondary-bg);
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .track-item:active {
            transform: scale(0.98);
        }
        
        .track-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }
        
        .track-info {
            flex: 1;
            min-width: 0;
        }
        
        .track-name {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .track-duration {
            font-size: 13px;
            color: var(--hint-color);
            margin-top: 3px;
        }
        
        .playlist-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            color: white;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .playlist-card:active {
            transform: scale(0.98);
        }
        
        .playlist-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .playlist-count {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .add-btn {
            background: var(--button-color);
            color: var(--button-text);
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            margin-bottom: 20px;
        }
        
        .playlist-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .action-btn {
            flex: 1;
            background: var(--secondary-bg);
            color: var(--text-color);
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .profile-card {
            background: var(--secondary-bg);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
        }
        
        .profile-photo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
            overflow: hidden;
        }
        
        .profile-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .profile-name {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .profile-username {
            color: var(--hint-color);
            margin-bottom: 5px;
        }
        
        .profile-id {
            color: var(--hint-color);
            font-size: 14px;
        }
        
        .player {
            position: fixed;
            bottom: 60px;
            left: 0;
            right: 0;
            background: var(--bg-color);
            border-top: 1px solid var(--border-color);
            padding: 12px 15px;
            display: none;
            z-index: 99;
        }
        
        .player.active {
            display: block;
        }
        
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .close-player {
            font-size: 20px;
            cursor: pointer;
            padding: 5px;
            color: var(--hint-color);
        }
        
        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .player-controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            align-items: center;
            margin-top: 10px;
        }
        
        .player-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            padding: 5px;
        }
        
        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--border-color);
            border-radius: 2px;
            cursor: pointer;
        }
        
        .progress {
            height: 100%;
            background: var(--button-color);
            border-radius: 2px;
            width: 0;
        }
        
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-color);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }
        
        .nav-item {
            flex: 1;
            text-align: center;
            padding: 8px;
            cursor: pointer;
            transition: transform 0.2s;
            color: var(--hint-color);
        }
        
        .nav-item:active {
            transform: scale(0.95);
        }
        
        .nav-item.active {
            color: var(--button-color);
        }
        
        .nav-label {
            font-size: 13px;
            margin-top: 4px;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: var(--bg-color);
            padding: 25px;
            border-radius: 12px;
            max-width: 400px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .modal-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 15px;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 15px;
            background: var(--bg-color);
            color: var(--text-color);
        }
        
        .modal-buttons {
            display: flex;
            gap: 10px;
        }
        
        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .btn-primary {
            background: var(--button-color);
            color: var(--button-text);
        }
        
        .btn-secondary {
            background: var(--secondary-bg);
            color: var(--text-color);
        }
        
        .track-checkbox {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--secondary-bg);
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
        }
        
        .checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-color);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .checkbox.checked {
            background: var(--button-color);
            border-color: var(--button-color);
        }
        
        .settings-menu {
            padding: 0;
        }
        
        .settings-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid var(--border-color);
        }
        
        .settings-item:last-child {
            border-bottom: none;
        }
        
        .toggle-switch {
            position: relative;
            width: 50px;
            height: 28px;
            background: var(--border-color);
            border-radius: 14px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .toggle-switch.active {
            background: var(--button-color);
        }
        
        .toggle-slider {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 22px;
            height: 22px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s;
        }
        
        .toggle-switch.active .toggle-slider {
            transform: translateX(22px);
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--hint-color);
        }
        
        .empty-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="back-btn" id="backBtn" onclick="goBack()">←</div>
            <h1 id="headerTitle">Мои треки</h1>
        </div>
        <div class="settings-icon" id="settingsIcon" onclick="showSettings()">⚙️</div>
    </div>
    
    <div class="container">
        <!-- Главная -->
        <div id="homeTab" class="tab active">
            <div id="tracksList"></div>
        </div>
        
        <!-- Плейлисты -->
        <div id="playlistsTab" class="tab">
            <button class="add-btn" onclick="showCreatePlaylist()">➕ Создать плейлист</button>
            <div id="playlistsList"></div>
        </div>
        
        <!-- Просмотр плейлиста -->
        <div id="playlistViewTab" class="tab">
            <div class="playlist-actions">
                <button class="action-btn" onclick="showAddTracksToPlaylist()">➕ Добавить трек</button>
                <button class="action-btn" onclick="sharePlaylist()">📤 Поделиться</button>
            </div>
            <div id="playlistTracks"></div>
        </div>
        
        <!-- Профиль -->
        <div id="profileTab" class="tab">
            <div class="profile-card">
                <div class="profile-photo" id="profilePhoto">👤</div>
                <div class="profile-name" id="profileName">Имя пользователя</div>
                <div class="profile-username" id="profileUsername">@username</div>
                <div class="profile-id" id="profileId">ID: 000000</div>
            </div>
        </div>
    </div>
    
    <!-- Плеер -->
    <div class="player" id="player">
        <div class="player-header">
            <div class="progress-bar" onclick="seekAudio(event)">
                <div class="progress" id="progress"></div>
            </div>
            <div class="close-player" onclick="closePlayer()">✕</div>
        </div>
        <div class="player-info">
            <div class="track-icon">🎵</div>
            <div class="track-info">
                <div class="track-name" id="currentTrackName">Не выбран трек</div>
                <div class="track-duration" id="currentTime">0:00 / 0:00</div>
            </div>
        </div>
        <div class="player-controls">
            <button class="player-btn" onclick="prevTrack()">⏮️</button>
            <button class="player-btn" id="playPauseBtn" onclick="togglePlay()">▶️</button>
            <button class="player-btn" onclick="nextTrack()">⏭️</button>
        </div>
    </div>
    
    <!-- Навигация -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home')">
            <div class="nav-label">Главная</div>
        </div>
        <div class="nav-item" onclick="switchTab('playlists')">
            <div class="nav-label">Плейлисты</div>
        </div>
        <div class="nav-item" onclick="switchTab('profile')">
            <div class="nav-label">Профиль</div>
        </div>
    </div>
    
    <!-- Модальное окно создания плейлиста -->
    <div class="modal" id="createPlaylistModal">
        <div class="modal-content">
            <div class="modal-title">Создать плейлист</div>
            <input type="text" id="playlistNameInput" placeholder="Название плейлиста">
            <div class="modal-buttons">
                <button class="modal-btn btn-secondary" onclick="closeModal('createPlaylistModal')">Отмена</button>
                <button class="modal-btn btn-primary" onclick="createPlaylist()">Создать</button>
            </div>
        </div>
    </div>
    
    <!-- Модальное окно добавления треков -->
    <div class="modal" id="addTracksModal">
        <div class="modal-content">
            <div class="modal-title">Добавить треки</div>
            <div id="tracksCheckboxList"></div>
            <div class="modal-buttons">
                <button class="modal-btn btn-secondary" onclick="closeModal('addTracksModal')">Отмена</button>
                <button class="modal-btn btn-primary" onclick="addSelectedTracks()">Добавить</button>
            </div>
        </div>
    </div>
    
    <!-- Модальное окно настроек -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-title">Настройки</div>
            <div class="settings-menu">
                <div class="settings-item">
                    <div>Тёмная тема</div>
                    <div class="toggle-switch" id="themeToggle" onclick="toggleTheme()">
                        <div class="toggle-slider"></div>
                    </div>
                </div>
            </div>
            <div style="margin-top: 20px;">
                <button class="modal-btn btn-secondary" style="width: 100%;" onclick="closeModal('settingsModal')">Закрыть</button>
            </div>
        </div>
    </div>
    
    <audio id="audioPlayer"></audio>
    
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        let currentUser = null;
        let tracks = [];
        let playlists = [];
        let currentTrackIndex = -1;
        let currentPlaylistId = null;
        let audioPlayer = document.getElementById('audioPlayer');
        
        // Загружаем сохраненную тему
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-theme');
            document.getElementById('themeToggle').classList.add('active');
        }
        
        // Получаем данные пользователя из Telegram
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            currentUser = tg.initDataUnsafe.user;
            
            document.getElementById('profileName').textContent = currentUser.first_name || 'Пользователь';
            
            if (currentUser.username) {
                document.getElementById('profileUsername').textContent = `@${currentUser.username}`;
            } else {
                document.getElementById('profileUsername').textContent = '';
            }
            
            const formattedId = String(currentUser.id).padStart(6, '0');
            document.getElementById('profileId').textContent = `ID: ${formattedId}`;
            
            if (currentUser.photo_url) {
                document.getElementById('profilePhoto').innerHTML = `<img src="${currentUser.photo_url}" alt="Profile">`;
            } else {
                const initial = currentUser.first_name ? currentUser.first_name[0].toUpperCase() : '👤';
                document.getElementById('profilePhoto').textContent = initial;
            }
        } else {
            document.getElementById('profileName').textContent = 'Имя пользователя';
            document.getElementById('profileUsername').textContent = '@username';
            document.getElementById('profileId').textContent = 'ID: 000000';
        }
        
        function showSettings() {
            document.getElementById('settingsModal').classList.add('active');
        }
        
        function toggleTheme() {
            document.body.classList.toggle('dark-theme');
            document.getElementById('themeToggle').classList.toggle('active');
            
            if (document.body.classList.contains('dark-theme')) {
                localStorage.setItem('theme', 'dark');
            } else {
                localStorage.setItem('theme', 'light');
            }
        }
        
        // Загружаем данные
        async function loadData() {
            const userId = currentUser?.id || 'demo';
            
            try {
                // Загружаем треки из API
                const API_URL = window.location.hostname === 'localhost' 
                    ? 'http://localhost:8080' 
                    : 'https://mysongplaylist.vercel.app/'; // Замените на ваш домен API
                
                const tracksResponse = await fetch(`${API_URL}/api/tracks?user_id=${userId}`);
                if (tracksResponse.ok) {
                    tracks = await tracksResponse.json();
                } else {
                    tracks = [];
                }
                
                const playlistsResponse = await fetch(`${API_URL}/api/playlists?user_id=${userId}`);
                if (playlistsResponse.ok) {
                    playlists = await playlistsResponse.json();
                } else {
                    // Fallback на localStorage для плейлистов
                    const savedPlaylists = localStorage.getItem(`playlists_${userId}`);
                    playlists = savedPlaylists ? JSON.parse(savedPlaylists) : [];
                }
            } catch (error) {
                console.error('Ошибка загрузки данных:', error);
                tracks = [];
                const savedPlaylists = localStorage.getItem(`playlists_${userId}`);
                playlists = savedPlaylists ? JSON.parse(savedPlaylists) : [];
            }
            
            renderTracks();
            renderPlaylists();
        }
        
        function renderTracks() {
            const tracksList = document.getElementById('tracksList');
            
            if (tracks.length === 0) {
                tracksList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🎵</div>
                        <p>Нет треков</p>
                        <p style="font-size: 14px; margin-top: 10px;">Отправьте аудиофайлы боту</p>
                    </div>
                `;
                return;
            }
            
            tracksList.innerHTML = tracks.map((track, index) => `
                <div class="track-item" onclick="playTrack(${index})">
                    <div class="track-icon">🎵</div>
                    <div class="track-info">
                        <div class="track-name">${track.name}</div>
                        <div class="track-duration">${formatDuration(track.duration)}</div>
                    </div>
                </div>
            `).join('');
        }
        
        function renderPlaylists() {
            const playlistsList = document.getElementById('playlistsList');
            
            if (playlists.length === 0) {
                playlistsList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📝</div>
                        <p>Нет плейлистов</p>
                    </div>
                `;
                return;
            }
            
            playlistsList.innerHTML = playlists.map(playlist => `
                <div class="playlist-card" onclick="openPlaylist(${playlist.id})">
                    <div class="playlist-name">${playlist.name}</div>
                    <div class="playlist-count">${playlist.tracks?.length || 0} треков</div>
                </div>
            `).join('');
        }
        
        function openPlaylist(playlistId) {
            currentPlaylistId = playlistId;
            const playlist = playlists.find(p => p.id === playlistId);
            
            if (!playlist) return;
            
            document.getElementById('headerTitle').textContent = playlist.name;
            document.getElementById('backBtn').classList.add('visible');
            
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('playlistViewTab').classList.add('active');
            
            renderPlaylistTracks(playlist);
        }
        
        function renderPlaylistTracks(playlist) {
            const playlistTracks = document.getElementById('playlistTracks');
            
            if (!playlist.tracks || playlist.tracks.length === 0) {
                playlistTracks.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🎵</div>
                        <p>В плейлисте нет треков</p>
                    </div>
                `;
                return;
            }
            
            playlistTracks.innerHTML = playlist.tracks.map((trackId, index) => {
                const track = tracks.find(t => t.id === trackId);
                if (!track) return '';
                
                return `
                    <div class="track-item" onclick="playTrackFromPlaylist(${index})">
                        <div class="track-icon">🎵</div>
                        <div class="track-info">
                            <div class="track-name">${track.name}</div>
                            <div class="track-duration">${formatDuration(track.duration)}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function showAddTracksToPlaylist() {
            const tracksCheckboxList = document.getElementById('tracksCheckboxList');
            const playlist = playlists.find(p => p.id === currentPlaylistId);
            
            if (tracks.length === 0) {
                tg.showAlert('Нет доступных треков для добавления');
                return;
            }
            
            tracksCheckboxList.innerHTML = tracks.map(track => {
                const isInPlaylist = playlist.tracks?.includes(track.id);
                return `
                    <div class="track-checkbox" onclick="toggleTrackSelection(${track.id})">
                        <div class="checkbox ${isInPlaylist ? 'checked' : ''}" id="checkbox-${track.id}">
                            ${isInPlaylist ? '✓' : ''}
                        </div>
                        <div class="track-info">
                            <div class="track-name">${track.name}</div>
                            <div class="track-duration">${formatDuration(track.duration)}</div>
                        </div>
                    </div>
                `;
            }).join('');
            
            document.getElementById('addTracksModal').classList.add('active');
        }
        
        function toggleTrackSelection(trackId) {
            const checkbox = document.getElementById(`checkbox-${trackId}`);
            checkbox.classList.toggle('checked');
            checkbox.textContent = checkbox.classList.contains('checked') ? '✓' : '';
        }
        
        function addSelectedTracks() {
            const playlist = playlists.find(p => p.id === currentPlaylistId);
            if (!playlist) return;
            
            if (!playlist.tracks) playlist.tracks = [];
            
            tracks.forEach(track => {
                const checkbox = document.getElementById(`checkbox-${track.id}`);
                if (checkbox && checkbox.classList.contains('checked')) {
                    if (!playlist.tracks.includes(track.id)) {
                        playlist.tracks.push(track.id);
                    }
                } else {
                    const index = playlist.tracks.indexOf(track.id);
                    if (index > -1) {
                        playlist.tracks.splice(index, 1);
                    }
                }
            });
            
            const userId = currentUser?.id || 'demo';
            localStorage.setItem(`playlists_${userId}`, JSON.stringify(playlists));
            
            renderPlaylistTracks(playlist);
            closeModal('addTracksModal');
            tg.showAlert('Треки обновлены!');
        }
        
        function sharePlaylist() {
            const playlist = playlists.find(p => p.id === currentPlaylistId);
            if (!playlist) return;
            
            const shareData = {
                name: playlist.name,
                tracks: playlist.tracks,
                sharedBy: currentUser?.id || 'unknown'
            };
            
            const shareUrl = `https://t.me/share/url?url=${encodeURIComponent('Плейлист: ' + playlist.name)}&text=${encodeURIComponent('Послушай мой плейлист!')}`;
            
            // В продакшене здесь будет генерация уникальной ссылки
            tg.openTelegramLink(shareUrl);
        }
        
        function goBack() {
            document.getElementById('backBtn').classList.remove('visible');
            switchTab('playlists');
        }
        
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            const settingsIcon = document.getElementById('settingsIcon');
            const backBtn = document.getElementById('backBtn');
            backBtn.classList.remove('visible');
            
            if (tab === 'home') {
                document.getElementById('homeTab').classList.add('active');
                document.querySelector('.nav-item:nth-child(1)').classList.add('active');
                document.getElementById('headerTitle').textContent = 'Мои треки';
                settingsIcon.classList.remove('visible');
            } else if (tab === 'playlists') {
                document.getElementById('playlistsTab').classList.add('active');
                document.querySelector('.nav-item:nth-child(2)').classList.add('active');
                document.getElementById('headerTitle').textContent = 'Плейлисты';
                settingsIcon.classList.remove('visible');
            } else if (tab === 'profile') {
                document.getElementById('profileTab').classList.add('active');
                document.querySelector('.nav-item:nth-child(3)').classList.add('active');
                document.getElementById('headerTitle').textContent = 'Профиль';
                settingsIcon.classList.add('visible');
            }
        }
        
        function playTrack(index) {
            currentTrackIndex = index;
            const track = tracks[index];
            
            document.getElementById('currentTrackName').textContent = track.name;
            document.getElementById('player').classList.add('active');
            
            // Загружаем аудио через Telegram Bot API
            if (track.file_path) {
                const BOT_TOKEN = '8527310629:AAEGHA2PWMEEbp3Bjqvf7cJtXMwo8l2FIYk'; // В продакшене нужно получить токен безопасным способом
                audioPlayer.src = `https://api.telegram.org/file/bot${BOT_TOKEN}/${track.file_path}`;
                audioPlayer.play().catch(e => console.error('Ошибка воспроизведения:', e));
                document.getElementById('playPauseBtn').textContent = '⏸️';
            } else {
                console.error('Файл не найден');
            }
        }
        
        function playTrackFromPlaylist(index) {
            const playlist = playlists.find(p => p.id === currentPlaylistId);
            if (!playlist) return;
            
            const trackId = playlist.tracks[index];
            const trackIndex = tracks.findIndex(t => t.id === trackId);
            
            if (trackIndex !== -1) {
                playTrack(trackIndex);
            }
        }
        
        function closePlayer() {
            document.getElementById('player').classList.remove('active');
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
        }
        
        function togglePlay() {
            if (audioPlayer.paused) {
                audioPlayer.play();
                document.getElementById('playPauseBtn').textContent = '⏸️';
            } else {
                audioPlayer.pause();
                document.getElementById('playPauseBtn').textContent = '▶️';
            }
        }
        
        function prevTrack() {
            if (currentTrackIndex > 0) {
                playTrack(currentTrackIndex - 1);
            }
        }
        
        function nextTrack() {
            if (currentTrackIndex < tracks.length - 1) {
                playTrack(currentTrackIndex + 1);
            }
        }
        
        function seekAudio(event) {
            const progressBar = event.currentTarget;
            const clickX = event.offsetX;
            const width = progressBar.offsetWidth;
            const duration = audioPlayer.duration;
            audioPlayer.currentTime = (clickX / width) * duration;
        }
        
        audioPlayer.addEventListener('timeupdate', () => {
            const progress = (audioPlayer.currentTime / audioPlayer.duration) * 100;
            document.getElementById('progress').style.width = progress + '%';
            
            const current = formatDuration(audioPlayer.currentTime);
            const total = formatDuration(audioPlayer.duration);
            document.getElementById('currentTime').textContent = `${current} / ${total}`;
        });
        
        function formatDuration(seconds) {
            if (!seconds || isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        function showCreatePlaylist() {
            document.getElementById('createPlaylistModal').classList.add('active');
        }
        
        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
            if (modalId === 'createPlaylistModal') {
                document.getElementById('playlistNameInput').value = '';
            }
        }
        
        function createPlaylist() {
            const name = document.getElementById('playlistNameInput').value.trim();
            if (!name) {
                tg.showAlert('Введите название плейлиста');
                return;
            }
            
            playlists.push({
                id: Date.now(),
                name: name,
                tracks: []
            });
            
            const userId = currentUser?.id || 'demo';
            localStorage.setItem(`playlists_${userId}`, JSON.stringify(playlists));
            renderPlaylists();
            closeModal('createPlaylistModal');
            tg.showAlert('Плейлист создан!');
        }
        
        // Обновление треков каждые 3 секунды (для синхронизации с ботом)
        setInterval(() => {
            loadData();
        }, 3000);
        
        loadData();
    </script>
</body>
</html>
