<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>My Song Playlist Bot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-primary: #1A1A1D;
            --bg-secondary: #4E4E50;
            --accent-dark: #6F2232;
            --accent-main: #950740;
            --accent-bright: #C3073F;
            --text-primary: #FFFFFF;
            --text-secondary: #B3B3B3;
            --glass-bg: rgba(78, 78, 80, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        [data-theme="light"] {
            --bg-primary: #F5F5F7;
            --bg-secondary: #FFFFFF;
            --accent-dark: #C3073F;
            --accent-main: #950740;
            --accent-bright: #6F2232;
            --text-primary: #1A1A1D;
            --text-secondary: #6E6E73;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Заголовок приложения */
        .app-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
        }

        .app-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .settings-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .settings-btn:hover {
            background: var(--accent-main);
            transform: rotate(90deg);
        }

        /* Настройки */
        .settings-modal {
            position: fixed;
            top: 70px;
            right: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            z-index: 1000;
            opacity: 0;
            transform: translateY(-10px) scale(0.95);
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .settings-modal.active {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: all;
        }

        .theme-switch {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            min-width: 200px;
        }

        .theme-label {
            font-size: 14px;
            font-weight: 500;
        }

        .switch {
            position: relative;
            width: 50px;
            height: 28px;
            background: var(--bg-secondary);
            border-radius: 14px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .switch-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 22px;
            height: 22px;
            background: var(--text-primary);
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .switch.active .switch-thumb {
            transform: translateX(22px);
        }

        /* Контент */
        .app-content {
            padding: 80px 20px 100px;
            min-height: 100vh;
        }

        /* Карточки треков */
        .tracks-grid {
            display: grid;
            gap: 12px;
        }

        .track-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: all 0.3s;
            animation: fadeInUp 0.5s ease backwards;
        }

        .track-card:hover {
            background: var(--accent-main);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(149, 7, 64, 0.3);
        }

        .track-cover {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--accent-main), var(--accent-bright));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        .track-info {
            flex: 1;
            overflow: hidden;
        }

        .track-title {
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .track-artist {
            font-size: 14px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Плеер */
        .player {
            position: fixed;
            bottom: 80px;
            left: 0;
            right: 0;
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-top: 1px solid var(--glass-border);
            padding: 20px;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 90;
        }

        .player.active {
            transform: translateY(0);
        }

        .player-close {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--bg-secondary);
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.3s;
        }

        .player-close:hover {
            background: var(--accent-main);
            transform: rotate(90deg);
        }

        .player-cover {
            width: 100%;
            max-width: 300px;
            height: 300px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, var(--accent-main), var(--accent-bright));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            box-shadow: 0 10px 40px rgba(149, 7, 64, 0.4);
        }

        .player-info {
            text-align: center;
            margin-bottom: 30px;
        }

        .player-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .player-artist {
            font-size: 18px;
            color: var(--text-secondary);
        }

        .player-progress {
            margin-bottom: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--bg-secondary);
            border-radius: 2px;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-bright);
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s;
        }

        .progress-time {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.3s;
        }

        .control-btn:hover {
            background: var(--accent-main);
            transform: scale(1.1);
        }

        .control-btn.play {
            width: 64px;
            height: 64px;
            background: var(--accent-main);
            font-size: 28px;
        }

        /* Плейлисты */
        .playlists-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
        }

        .playlist-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
            animation: fadeInUp 0.5s ease backwards;
        }

        .playlist-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(149, 7, 64, 0.3);
        }

        .playlist-cover {
            width: 100%;
            height: 160px;
            background: linear-gradient(135deg, var(--accent-main), var(--accent-bright));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }

        .playlist-info {
            padding: 12px;
        }

        .playlist-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .playlist-count {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .add-playlist-btn {
            background: var(--accent-main);
            border: none;
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 600;
            padding: 16px;
            width: 100%;
            cursor: pointer;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .add-playlist-btn:hover {
            background: var(--accent-bright);
            transform: translateY(-2px);
        }

        /* Профиль */
        .profile-container {
            max-width: 400px;
            margin: 0 auto;
        }

        .profile-header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInUp 0.5s ease;
        }

        .profile-photo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--accent-main), var(--accent-bright));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            border: 4px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(149, 7, 64, 0.3);
        }

        .profile-photo img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .profile-name {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .profile-username {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .profile-id {
            font-size: 14px;
            color: var(--text-secondary);
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 8px 16px;
            display: inline-block;
        }

        .profile-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent-bright);
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Друзья */
        .friends-search {
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 14px 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 16px;
            transition: all 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-main);
            box-shadow: 0 0 0 3px rgba(149, 7, 64, 0.2);
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }

        .friends-list {
            display: grid;
            gap: 12px;
        }

        .friend-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .friend-card:hover {
            background: var(--accent-dark);
            transform: translateY(-2px);
        }

        .friend-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-main), var(--accent-bright));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .friend-info {
            flex: 1;
        }

        .friend-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .friend-username {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* Чат */
        .chat-container {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            bottom: 80px;
            background: var(--bg-primary);
            z-index: 200;
            display: none;
            flex-direction: column;
        }

        .chat-container.active {
            display: flex;
        }

        .chat-header {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-back-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--bg-secondary);
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 16px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            animation: fadeInUp 0.3s ease;
        }

        .message.sent {
            align-self: flex-end;
            background: var(--accent-main);
        }

        .message.received {
            align-self: flex-start;
        }

        .chat-input-container {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
            padding: 15px 20px;
            display: flex;
            gap: 12px;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            color: var(--text-primary);
            font-size: 14px;
        }

        .chat-input:focus {
            outline: none;
            border-color: var(--accent-main);
        }

        .chat-send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--accent-main);
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.3s;
        }

        .chat-send-btn:hover {
            background: var(--accent-bright);
            transform: scale(1.1);
        }

        /* Нижняя навигация */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-top: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 20px;
            padding-bottom: env(safe-area-inset-bottom);
            z-index: 99;
        }

        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 12px;
        }

        .nav-btn.active {
            color: var(--accent-bright);
            background: rgba(195, 7, 63, 0.1);
        }

        .nav-icon {
            font-size: 24px;
        }

        .nav-label {
            font-size: 11px;
            font-weight: 500;
        }

        /* Пустое состояние */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-text {
            font-size: 16px;
            line-height: 1.6;
        }

        /* Анимации */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Скрытие элементов */
        .hidden {
            display: none !important;
        }

        /* Адаптив */
        @media (max-width: 480px) {
            .app-content {
                padding: 70px 15px 90px;
            }

            .playlists-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }

            .player-cover {
                max-width: 250px;
                height: 250px;
            }
        }
    </style>
</head>
<body>
    <!-- Шапка -->
    <div class="app-header">
        <div class="app-title">Music Player</div>
        <div class="settings-btn" onclick="toggleSettings()">
            <span>⚙️</span>
        </div>
    </div>

    <!-- Модальное окно настроек -->
    <div class="settings-modal" id="settingsModal">
        <div class="theme-switch">
            <span class="theme-label">Темная тема</span>
            <div class="switch" id="themeSwitch" onclick="toggleTheme()">
                <div class="switch-thumb"></div>
            </div>
        </div>
    </div>

    <!-- Основной контент -->
    <div class="app-content">
        <!-- Главная страница -->
        <div id="homeContent" class="content-section">
            <div class="tracks-grid" id="tracksGrid">
                <div class="empty-state">
                    <div class="empty-icon">🎵</div>
                    <div class="empty-text">
                        Отправьте аудиофайлы боту<br>
                        чтобы они появились здесь
                    </div>
                </div>
            </div>
        </div>

        <!-- Плейлисты -->
        <div id="playlistsContent" class="content-section hidden">
            <button class="add-playlist-btn" onclick="createPlaylist()">
                ➕ Создать плейлист
            </button>
            <div class="playlists-grid" id="playlistsGrid">
                <div class="empty-state">
                    <div class="empty-icon">📝</div>
                    <div class="empty-text">
                        Создайте свой первый плейлист
                    </div>
                </div>
            </div>
        </div>

        <!-- Профиль -->
        <div id="profileContent" class="content-section hidden">
            <div class="profile-container">
                <div class="profile-header">
                    <div class="profile-photo" id="profilePhoto">
                        👤
                    </div>
                    <div class="profile-name" id="profileName">Загрузка...</div>
                    <div class="profile-username" id="profileUsername">@username</div>
                    <div class="profile-id" id="profileId">ID: 000000</div>
                </div>
                
                <div class="profile-stats">
                    <div class="stat-card">
                        <div class="stat-value" id="tracksCount">0</div>
                        <div class="stat-label">Треков</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="playlistsCount">0</div>
                        <div class="stat-label">Плейлистов</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="friendsCount">0</div>
                        <div class="stat-label">Друзей</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Друзья -->
        <div id="friendsContent" class="content-section hidden">
            <div class="friends-search">
                <input type="text" class="search-input" placeholder="Поиск друзей по @username" id="friendSearch">
            </div>
            <div class="friends-list" id="friendsList">
                <div class="empty-state">
                    <div class="empty-icon">👥</div>
                    <div class="empty-text">
                        Найдите друзей и начните общаться
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Чат -->
    <div class="chat-container" id="chatContainer">
        <div class="chat-header">
            <button class="chat-back-btn" onclick="closeChat()">←</button>
            <div class="friend-avatar">👤</div>
            <div class="friend-info">
                <div class="friend-name" id="chatFriendName">Друг</div>
                <div class="friend-username" id="chatFriendUsername">@username</div>
            </div>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-container">
            <input type="text" class="chat-input" placeholder="Сообщение..." id="chatInput">
            <button class="chat-send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <!-- Плеер -->
    <div class="player" id="player">
        <button class="player-close" onclick="closePlayer()">✕</button>
        <div class="player-cover">🎵</div>
        <div class="player-info">
            <div class="player-title" id="playerTitle">Название трека</div>
            <div class="player-artist" id="playerArtist">Исполнитель</div>
        </div>
        <div class="player-progress">
            <div class="progress-bar" onclick="seekAudio(event)">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-time">
                <span id="currentTime">0:00</span>
                <span id="totalTime">0:00</span>
            </div>
        </div>
        <div class="player-controls">
            <button class="control-btn" onclick="previousTrack()">⏮</button>
            <button class="control-btn play" onclick="togglePlay()" id="playBtn">▶️</button>
            <button class="control-btn" onclick="nextTrack()">⏭</button>
            <button class="control-btn" onclick="sharePlaylist()">📤</button>
        </div>
        <audio id="audioPlayer"></audio>
    </div>

    <!-- Нижняя навигация -->
    <div class="bottom-nav">
        <button class="nav-btn active" onclick="switchTab('home')">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">Главная</span>
        </button>
        <button class="nav-btn" onclick="switchTab('playlists')">
            <span class="nav-icon">📝</span>
            <span class="nav-label">Плейлисты</span>
        </button>
        <button class="nav-btn" onclick="switchTab('profile')">
            <span class="nav-icon">👤</span>
            <span class="nav-label">Профиль</span>
        </button>
        <button class="nav-btn" onclick="switchTab('friends')">
            <span class="nav-icon">👥</span>
            <span class="nav-label">Друзья</span>
        </button>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();

        // Получение данных пользователя
        const user = tg.initDataUnsafe.user || {
            id: 123456789,
            first_name: "Пользователь",
            username: "username",
            photo_url: null
        };

        // Глобальные переменные
        let currentTab = 'home';
        let tracks = [];
        let playlists = [];
        let friends = [];
        let currentTrackIndex = 0;
        let isPlaying = false;
        let currentFriend = null;

        // Инициализация приложения
        async function initApp() {
            loadTheme();
            loadUserProfile();
            await loadTracks();
            await loadPlaylists();
            await loadFriends();
        }

        // Загрузка темы
        function loadTheme() {
            const theme = localStorage.getItem('theme') || 'dark';
            if (theme === 'light') {
                document.body.setAttribute('data-theme', 'light');
                document.getElementById('themeSwitch').classList.add('active');
            }
        }

        // Переключение темы
        function toggleTheme() {
            const body = document.body;
            const themeSwitch = document.getElementById('themeSwitch');
            
            if (body.getAttribute('data-theme') === 'light') {
                body.removeAttribute('data-theme');
                themeSwitch.classList.remove('active');
                localStorage.setItem('theme', 'dark');
            } else {
                body.setAttribute('data-theme', 'light');
                themeSwitch.classList.add('active');
                localStorage.setItem('theme', 'light');
            }
        }

        // Переключение настроек
        function toggleSettings() {
            const modal = document.getElementById('settingsModal');
            modal.classList.toggle('active');
        }

        // Закрытие настроек при клике вне
        document.addEventListener('click', (e) => {
            const modal = document.getElementById('settingsModal');
            const settingsBtn = document.querySelector('.settings-btn');
            
            if (!modal.contains(e.target) && !settingsBtn.contains(e.target)) {
                modal.classList.remove('active');
            }
        });

        // Загрузка профиля пользователя
        function loadUserProfile() {
            const userId = user.id.toString().padStart(6, '0');
            
            document.getElementById('profileName').textContent = user.first_name;
            document.getElementById('profileUsername').textContent = `@${user.username || 'username'}`;
            document.getElementById('profileId').textContent = `ID: ${userId}`;
            
            if (user.photo_url) {
                document.getElementById('profilePhoto').innerHTML = `<img src="${user.photo_url}" alt="Profile">`;
            }
        }

        // Загрузка треков (эмуляция)
        async function loadTracks() {
            // В реальном приложении здесь будет запрос к API
            // Для демонстрации создадим примеры
            tracks = JSON.parse(localStorage.getItem('tracks') || '[]');
            
            if (tracks.length === 0) {
                // Добавим примеры только для демонстрации
                tracks = [
                    { id: 1, title: "Пример трека 1", artist: "Исполнитель 1", file_id: "demo1" },
                    { id: 2, title: "Пример трека 2", artist: "Исполнитель 2", file_id: "demo2" }
                ];
            }
            
            renderTracks();
            updateStats();
        }

        // Отображение треков
        function renderTracks() {
            const grid = document.getElementById('tracksGrid');
            
            if (tracks.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🎵</div>
                        <div class="empty-text">
                            Отправьте аудиофайлы боту<br>
                            чтобы они появились здесь
                        </div>
                    </div>
                `;
                return;
            }
            
            grid.innerHTML = tracks.map((track, index) => `
                <div class="track-card" onclick="playTrack(${index})" style="animation-delay: ${index * 0.05}s">
                    <div class="track-cover">🎵</div>
                    <div class="track-info">
                        <div class="track-title">${track.title}</div>
                        <div class="track-artist">${track.artist}</div>
                    </div>
                </div>
            `).join('');
        }

        // Загрузка плейлистов
        async function loadPlaylists() {
            playlists = JSON.parse(localStorage.getItem('playlists') || '[]');
            renderPlaylists();
            updateStats();
        }

        // Отображение плейлистов
        function renderPlaylists() {
            const grid = document.getElementById('playlistsGrid');
            
            if (playlists.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📝</div>
                        <div class="empty-text">
                            Создайте свой первый плейлист
                        </div>
                    </div>
                `;
                return;
            }
            
            grid.innerHTML = playlists.map((playlist, index) => `
                <div class="playlist-card" onclick="openPlaylist(${index})" style="animation-delay: ${index * 0.05}s">
                    <div class="playlist-cover" style="background: ${playlist.color || 'linear-gradient(135deg, var(--accent-main), var(--accent-bright))'}">
                        🎵
                    </div>
                    <div class="playlist-info">
                        <div class="playlist-name">${playlist.name}</div>
                        <div class="playlist-count">${playlist.tracks?.length || 0} треков</div>
                    </div>
                </div>
            `).join('');
        }

        // Создание плейлиста
        function createPlaylist() {
            const name = prompt('Название плейлиста:');
            if (!name) return;
            
            const colors = [
                'linear-gradient(135deg, #6F2232, #950740)',
                'linear-gradient(135deg, #950740, #C3073F)',
                'linear-gradient(135deg, #4E4E50, #6F2232)',
                'linear-gradient(135deg, #1A1A1D, #4E4E50)'
            ];
            
            const playlist = {
                id: Date.now(),
                name: name,
                tracks: [],
                color: colors[Math.floor(Math.random() * colors.length)],
                created_at: new Date().toISOString()
            };
            
            playlists.push(playlist);
            localStorage.setItem('playlists', JSON.stringify(playlists));
            renderPlaylists();
            updateStats();
            
            tg.showAlert('Плейлист создан!');
        }

        // Открытие плейлиста
        function openPlaylist(index) {
            const playlist = playlists[index];
            tg.showAlert(`Плейлист: ${playlist.name}\nТреков: ${playlist.tracks?.length || 0}`);
        }

        // Загрузка друзей
        async function loadFriends() {
            friends = JSON.parse(localStorage.getItem('friends') || '[]');
            renderFriends();
            updateStats();
        }

        // Отображение друзей
        function renderFriends() {
            const list = document.getElementById('friendsList');
            
            if (friends.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">👥</div>
                        <div class="empty-text">
                            Найдите друзей и начните общаться
                        </div>
                    </div>
                `;
                return;
            }
            
            list.innerHTML = friends.map((friend, index) => `
                <div class="friend-card" onclick="openChat(${index})" style="animation-delay: ${index * 0.05}s">
                    <div class="friend-avatar">${friend.avatar || '👤'}</div>
                    <div class="friend-info">
                        <div class="friend-name">${friend.name}</div>
                        <div class="friend-username">@${friend.username}</div>
                    </div>
                </div>
            `).join('');
        }

        // Поиск друзей
        document.getElementById('friendSearch')?.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            
            if (query.length < 2) {
                renderFriends();
                return;
            }
            
            // Эмуляция поиска
            if (query === '@demo') {
                document.getElementById('friendsList').innerHTML = `
                    <div class="friend-card" onclick="addFriend('demo', 'Demo User')">
                        <div class="friend-avatar">🎭</div>
                        <div class="friend-info">
                            <div class="friend-name">Demo User</div>
                            <div class="friend-username">@demo</div>
                        </div>
                    </div>
                `;
            }
        });

        // Добавление друга
        function addFriend(username, name) {
            const friend = {
                id: Date.now(),
                username: username,
                name: name,
                avatar: '👤'
            };
            
            friends.push(friend);
            localStorage.setItem('friends', JSON.stringify(friends));
            renderFriends();
            updateStats();
            
            tg.showAlert('Друг добавлен!');
        }

        // Открытие чата
        function openChat(index) {
            currentFriend = friends[index];
            
            document.getElementById('chatFriendName').textContent = currentFriend.name;
            document.getElementById('chatFriendUsername').textContent = `@${currentFriend.username}`;
            document.getElementById('chatContainer').classList.add('active');
            
            loadMessages();
        }

        // Закрытие чата
        function closeChat() {
            document.getElementById('chatContainer').classList.remove('active');
            currentFriend = null;
        }

        // Загрузка сообщений
        function loadMessages() {
            const messages = JSON.parse(localStorage.getItem(`messages_${currentFriend.id}`) || '[]');
            const container = document.getElementById('chatMessages');
            
            container.innerHTML = messages.map(msg => `
                <div class="message ${msg.sent ? 'sent' : 'received'}">
                    ${msg.text}
                </div>
            `).join('');
            
            container.scrollTop = container.scrollHeight;
        }

        // Отправка сообщения
        function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            
            if (!text || !currentFriend) return;
            
            const messages = JSON.parse(localStorage.getItem(`messages_${currentFriend.id}`) || '[]');
            messages.push({
                text: text,
                sent: true,
                timestamp: new Date().toISOString()
            });
            
            localStorage.setItem(`messages_${currentFriend.id}`, JSON.stringify(messages));
            input.value = '';
            loadMessages();
        }

        // Обработка Enter в чате
        document.getElementById('chatInput')?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Воспроизведение трека
        function playTrack(index) {
            currentTrackIndex = index;
            const track = tracks[index];
            
            document.getElementById('playerTitle').textContent = track.title;
            document.getElementById('playerArtist').textContent = track.artist;
            document.getElementById('player').classList.add('active');
            
            // В реальном приложении здесь будет загрузка и воспроизведение аудио
            // const audioPlayer = document.getElementById('audioPlayer');
            // audioPlayer.src = `telegram_file_url/${track.file_id}`;
            // audioPlayer.play();
        }

        // Закрытие плеера
        function closePlayer() {
            document.getElementById('player').classList.remove('active');
            const audioPlayer = document.getElementById('audioPlayer');
            audioPlayer.pause();
            isPlaying = false;
            document.getElementById('playBtn').textContent = '▶️';
        }

        // Переключение воспроизведения
        function togglePlay() {
            const audioPlayer = document.getElementById('audioPlayer');
            const playBtn = document.getElementById('playBtn');
            
            if (isPlaying) {
                audioPlayer.pause();
                playBtn.textContent = '▶️';
            } else {
                audioPlayer.play();
                playBtn.textContent = '⏸';
            }
            
            isPlaying = !isPlaying;
        }

        // Предыдущий трек
        function previousTrack() {
            if (currentTrackIndex > 0) {
                playTrack(currentTrackIndex - 1);
            }
        }

        // Следующий трек
        function nextTrack() {
            if (currentTrackIndex < tracks.length - 1) {
                playTrack(currentTrackIndex + 1);
            }
        }

        // Поделиться плейлистом
        function sharePlaylist() {
            tg.showAlert('Функция "Поделиться" будет доступна в следующей версии!');
        }

        // Перемотка аудио
        function seekAudio(event) {
            const progressBar = event.currentTarget;
            const rect = progressBar.getBoundingClientRect();
            const percent = (event.clientX - rect.left) / rect.width;
            
            const audioPlayer = document.getElementById('audioPlayer');
            audioPlayer.currentTime = audioPlayer.duration * percent;
        }

        // Обновление прогресса воспроизведения
        document.getElementById('audioPlayer')?.addEventListener('timeupdate', (e) => {
            const audio = e.target;
            const percent = (audio.currentTime / audio.duration) * 100;
            
            document.getElementById('progressFill').style.width = `${percent}%`;
            document.getElementById('currentTime').textContent = formatTime(audio.currentTime);
            document.getElementById('totalTime').textContent = formatTime(audio.duration);
        });

        // Форматирование времени
        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // Переключение вкладок
        function switchTab(tab) {
            currentTab = tab;
            
            // Скрываем все секции
            document.querySelectorAll('.content-section').forEach(section => {
                section.classList.add('hidden');
            });
            
            // Показываем нужную секцию
            const sections = {
                'home': 'homeContent',
                'playlists': 'playlistsContent',
                'profile': 'profileContent',
                'friends': 'friendsContent'
            };
            
            document.getElementById(sections[tab]).classList.remove('hidden');
            
            // Обновляем активную кнопку
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            event.currentTarget.classList.add('active');
        }

        // Обновление статистики
        function updateStats() {
            document.getElementById('tracksCount').textContent = tracks.length;
            document.getElementById('playlistsCount').textContent = playlists.length;
            document.getElementById('friendsCount').textContent = friends.length;
        }

        // Обработка данных от бота
        tg.onEvent('mainButtonClicked', () => {
            tg.close();
        });

        // Инициализация при загрузке
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>

</html>
