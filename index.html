<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Music App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg-color: #ffffff;
            --secondary-bg: #f5f5f5;
            --text-color: #000000;
            --hint-color: #999999;
            --border-color: #cccccc;
            --button-color: #3390ec;
            --button-text: #ffffff;
        }
        
        body.dark-theme {
            --bg-color: #1a1a1a;
            --secondary-bg: #2d2d2d;
            --text-color: #ffffff;
            --hint-color: #888888;
            --border-color: #444444;
            --button-color: #3390ec;
            --button-text: #ffffff;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 140px;
            overflow-x: hidden;
            transition: background-color 0.3s, color 0.3s;
        }
        
        .header {
            padding: 15px 20px;
            background: var(--secondary-bg);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }
        
        .settings-icon {
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: background 0.2s;
            display: none;
        }
        
        .settings-icon:active {
            background: var(--border-color);
        }
        
        .settings-icon.visible {
            display: block;
        }
        
        .container {
            padding: 15px;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .tab {
            display: none;
        }
        
        .tab.active {
            display: block;
        }
        
        .track-item {
            background: var(--secondary-bg);
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .track-item:active {
            transform: scale(0.98);
        }
        
        .track-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }
        
        .track-info {
            flex: 1;
            min-width: 0;
        }
        
        .track-name {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .track-duration {
            font-size: 13px;
            color: var(--hint-color);
            margin-top: 3px;
        }
        
        .playlist-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            color: white;
            cursor: pointer;
        }
        
        .playlist-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .playlist-count {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .add-btn {
            background: var(--button-color);
            color: var(--button-text);
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            margin-bottom: 20px;
        }
        
        .profile-card {
            background: var(--secondary-bg);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
        }
        
        .profile-photo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
            overflow: hidden;
        }
        
        .profile-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .profile-name {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .profile-username {
            color: var(--hint-color);
            margin-bottom: 5px;
        }
        
        .profile-id {
            color: var(--hint-color);
            font-size: 14px;
        }
        
        .theme-toggle {
            background: var(--secondary-bg);
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }
        
        .theme-toggle-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .theme-toggle-title {
            font-size: 16px;
            font-weight: 500;
        }
        
        .toggle-switch {
            position: relative;
            width: 50px;
            height: 28px;
            background: var(--border-color);
            border-radius: 14px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .toggle-switch.active {
            background: var(--button-color);
        }
        
        .toggle-slider {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 22px;
            height: 22px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s;
        }
        
        .toggle-switch.active .toggle-slider {
            transform: translateX(22px);
        }
        
        .player {
            position: fixed;
            bottom: 60px;
            left: 0;
            right: 0;
            background: var(--bg-color);
            border-top: 1px solid var(--border-color);
            padding: 12px 15px;
            display: none;
            z-index: 99;
        }
        
        .player.active {
            display: block;
        }
        
        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .player-controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            align-items: center;
        }
        
        .player-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            padding: 5px;
        }
        
        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--border-color);
            border-radius: 2px;
            margin: 10px 0;
            cursor: pointer;
        }
        
        .progress {
            height: 100%;
            background: var(--button-color);
            border-radius: 2px;
            width: 0;
        }
        
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-color);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }
        
        .nav-item {
            flex: 1;
            text-align: center;
            padding: 8px;
            cursor: pointer;
            transition: transform 0.2s;
            color: var(--hint-color);
        }
        
        .nav-item:active {
            transform: scale(0.95);
        }
        
        .nav-item.active {
            color: var(--button-color);
        }
        
        .nav-label {
            font-size: 13px;
            margin-top: 4px;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: var(--bg-color);
            padding: 25px;
            border-radius: 12px;
            max-width: 400px;
            width: 90%;
        }
        
        .modal-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 15px;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 15px;
            background: var(--bg-color);
            color: var(--text-color);
        }
        
        .modal-buttons {
            display: flex;
            gap: 10px;
        }
        
        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .btn-primary {
            background: var(--button-color);
            color: var(--button-text);
        }
        
        .btn-secondary {
            background: var(--secondary-bg);
            color: var(--text-color);
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--hint-color);
        }
        
        .empty-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 id="headerTitle">Мои треки</h1>
        <div class="settings-icon" id="settingsIcon" onclick="toggleTheme()">⚙️</div>
    </div>
    
    <div class="container">
        <!-- Главная -->
        <div id="homeTab" class="tab active">
            <div id="tracksList"></div>
        </div>
        
        <!-- Плейлисты -->
        <div id="playlistsTab" class="tab">
            <button class="add-btn" onclick="showCreatePlaylist()">➕ Создать плейлист</button>
            <div id="playlistsList"></div>
        </div>
        
        <!-- Профиль -->
        <div id="profileTab" class="tab">
            <div class="profile-card">
                <div class="profile-photo" id="profilePhoto">👤</div>
                <div class="profile-name" id="profileName">Имя пользователя</div>
                <div class="profile-username" id="profileUsername">@username</div>
                <div class="profile-id" id="profileId">ID: 000000</div>
            </div>
            
            <div class="theme-toggle">
                <div class="theme-toggle-header">
                    <div class="theme-toggle-title">Тёмная тема</div>
                    <div class="toggle-switch" id="themeToggle" onclick="toggleTheme()">
                        <div class="toggle-slider"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Плеер -->
    <div class="player" id="player">
        <div class="progress-bar" onclick="seekAudio(event)">
            <div class="progress" id="progress"></div>
        </div>
        <div class="player-info">
            <div class="track-icon">🎵</div>
            <div class="track-info">
                <div class="track-name" id="currentTrackName">Не выбран трек</div>
                <div class="track-duration" id="currentTime">0:00 / 0:00</div>
            </div>
        </div>
        <div class="player-controls">
            <button class="player-btn" onclick="prevTrack()">⏮️</button>
            <button class="player-btn" id="playPauseBtn" onclick="togglePlay()">▶️</button>
            <button class="player-btn" onclick="nextTrack()">⏭️</button>
        </div>
    </div>
    
    <!-- Навигация -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home')">
            <div class="nav-label">Главная</div>
        </div>
        <div class="nav-item" onclick="switchTab('playlists')">
            <div class="nav-label">Плейлисты</div>
        </div>
        <div class="nav-item" onclick="switchTab('profile')">
            <div class="nav-label">Профиль</div>
        </div>
    </div>
    
    <!-- Модальное окно создания плейлиста -->
    <div class="modal" id="createPlaylistModal">
        <div class="modal-content">
            <div class="modal-title">Создать плейлист</div>
            <input type="text" id="playlistNameInput" placeholder="Название плейлиста">
            <div class="modal-buttons">
                <button class="modal-btn btn-secondary" onclick="closeModal()">Отмена</button>
                <button class="modal-btn btn-primary" onclick="createPlaylist()">Создать</button>
            </div>
        </div>
    </div>
    
    <audio id="audioPlayer"></audio>
    
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        let currentUser = null;
        let tracks = [];
        let playlists = [];
        let currentTrackIndex = -1;
        let audioPlayer = document.getElementById('audioPlayer');
        
        // Загружаем сохраненную тему
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-theme');
            document.getElementById('themeToggle').classList.add('active');
        }
        
        // Получаем данные пользователя из Telegram
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            currentUser = tg.initDataUnsafe.user;
            
            // Устанавливаем имя
            document.getElementById('profileName').textContent = currentUser.first_name || 'Пользователь';
            
            // Устанавливаем username
            if (currentUser.username) {
                document.getElementById('profileUsername').textContent = `@${currentUser.username}`;
            } else {
                document.getElementById('profileUsername').textContent = '';
            }
            
            // Устанавливаем ID (форматируем как 6-значное число с ведущими нулями)
            const formattedId = String(currentUser.id).padStart(6, '0');
            document.getElementById('profileId').textContent = `ID: ${formattedId}`;
            
            // Загружаем фото профиля из Telegram
            if (currentUser.photo_url) {
                document.getElementById('profilePhoto').innerHTML = `<img src="${currentUser.photo_url}" alt="Profile">`;
            } else {
                // Если нет фото, показываем первую букву имени
                const initial = currentUser.first_name ? currentUser.first_name[0].toUpperCase() : '👤';
                document.getElementById('profilePhoto').textContent = initial;
            }
        } else {
            // Если данные Telegram недоступны, показываем демо данные
            document.getElementById('profileName').textContent = 'Имя пользователя';
            document.getElementById('profileUsername').textContent = '@username';
            document.getElementById('profileId').textContent = 'ID: 000000';
        }
        
        function toggleTheme() {
            document.body.classList.toggle('dark-theme');
            document.getElementById('themeToggle').classList.toggle('active');
            
            // Сохраняем выбор темы
            if (document.body.classList.contains('dark-theme')) {
                localStorage.setItem('theme', 'dark');
            } else {
                localStorage.setItem('theme', 'light');
            }
        }
        
        // Загружаем данные (имитация - в продакшене будет API)
        function loadData() {
            // Имитация загрузки треков из базы
            const savedTracks = localStorage.getItem('tracks');
            if (savedTracks) {
                tracks = JSON.parse(savedTracks);
            } else {
                tracks = [
                    { id: 1, name: 'Пример трека 1.mp3', duration: 180 },
                    { id: 2, name: 'Пример трека 2.mp3', duration: 240 }
                ];
            }
            
            const savedPlaylists = localStorage.getItem('playlists');
            if (savedPlaylists) {
                playlists = JSON.parse(savedPlaylists);
            }
            
            renderTracks();
            renderPlaylists();
        }
        
        function renderTracks() {
            const tracksList = document.getElementById('tracksList');
            
            if (tracks.length === 0) {
                tracksList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🎵</div>
                        <p>Нет треков</p>
                        <p style="font-size: 14px; margin-top: 10px;">Отправьте аудиофайлы боту</p>
                    </div>
                `;
                return;
            }
            
            tracksList.innerHTML = tracks.map((track, index) => `
                <div class="track-item" onclick="playTrack(${index})">
                    <div class="track-icon">🎵</div>
                    <div class="track-info">
                        <div class="track-name">${track.name}</div>
                        <div class="track-duration">${formatDuration(track.duration)}</div>
                    </div>
                </div>
            `).join('');
        }
        
        function renderPlaylists() {
            const playlistsList = document.getElementById('playlistsList');
            
            if (playlists.length === 0) {
                playlistsList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📝</div>
                        <p>Нет плейлистов</p>
                    </div>
                `;
                return;
            }
            
            playlistsList.innerHTML = playlists.map(playlist => `
                <div class="playlist-card">
                    <div class="playlist-name">${playlist.name}</div>
                    <div class="playlist-count">${playlist.tracks?.length || 0} треков</div>
                </div>
            `).join('');
        }
        
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            // Скрываем/показываем иконку настроек
            const settingsIcon = document.getElementById('settingsIcon');
            
            if (tab === 'home') {
                document.getElementById('homeTab').classList.add('active');
                document.querySelector('.nav-item:nth-child(1)').classList.add('active');
                document.getElementById('headerTitle').textContent = 'Мои треки';
                settingsIcon.classList.remove('visible');
            } else if (tab === 'playlists') {
                document.getElementById('playlistsTab').classList.add('active');
                document.querySelector('.nav-item:nth-child(2)').classList.add('active');
                document.getElementById('headerTitle').textContent = 'Плейлисты';
                settingsIcon.classList.remove('visible');
            } else if (tab === 'profile') {
                document.getElementById('profileTab').classList.add('active');
                document.querySelector('.nav-item:nth-child(3)').classList.add('active');
                document.getElementById('headerTitle').textContent = 'Профиль';
                settingsIcon.classList.add('visible');
            }
        }
        
        function playTrack(index) {
            currentTrackIndex = index;
            const track = tracks[index];
            
            document.getElementById('currentTrackName').textContent = track.name;
            document.getElementById('player').classList.add('active');
            
            // В продакшене здесь будет загрузка реального файла через Telegram Bot API
            // audioPlayer.src = track.url;
            // audioPlayer.play();
            
            document.getElementById('playPauseBtn').textContent = '⏸️';
        }
        
        function togglePlay() {
            if (audioPlayer.paused) {
                audioPlayer.play();
                document.getElementById('playPauseBtn').textContent = '⏸️';
            } else {
                audioPlayer.pause();
                document.getElementById('playPauseBtn').textContent = '▶️';
            }
        }
        
        function prevTrack() {
            if (currentTrackIndex > 0) {
                playTrack(currentTrackIndex - 1);
            }
        }
        
        function nextTrack() {
            if (currentTrackIndex < tracks.length - 1) {
                playTrack(currentTrackIndex + 1);
            }
        }
        
        function seekAudio(event) {
            const progressBar = event.currentTarget;
            const clickX = event.offsetX;
            const width = progressBar.offsetWidth;
            const duration = audioPlayer.duration;
            audioPlayer.currentTime = (clickX / width) * duration;
        }
        
        audioPlayer.addEventListener('timeupdate', () => {
            const progress = (audioPlayer.currentTime / audioPlayer.duration) * 100;
            document.getElementById('progress').style.width = progress + '%';
            
            const current = formatDuration(audioPlayer.currentTime);
            const total = formatDuration(audioPlayer.duration);
            document.getElementById('currentTime').textContent = `${current} / ${total}`;
        });
        
        function formatDuration(seconds) {
            if (!seconds || isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        function showCreatePlaylist() {
            document.getElementById('createPlaylistModal').classList.add('active');
        }
        
        function closeModal() {
            document.getElementById('createPlaylistModal').classList.remove('active');
            document.getElementById('playlistNameInput').value = '';
        }
        
        function createPlaylist() {
            const name = document.getElementById('playlistNameInput').value.trim();
            if (!name) {
                tg.showAlert('Введите название плейлиста');
                return;
            }
            
            playlists.push({
                id: Date.now(),
                name: name,
                tracks: []
            });
            
            localStorage.setItem('playlists', JSON.stringify(playlists));
            renderPlaylists();
            closeModal();
            tg.showAlert('Плейлист создан!');
        }
        
        loadData();
    </script>
</body>
</html>
